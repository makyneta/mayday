<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <title>MAYDAY — 404</title>
  <link rel="stylesheet" href="/assets/styles/main.css" />
  <style>
    body { overflow: hidden; }
    .err { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; text-align: center; padding: 2rem; min-height: 100vh; }
    .err__code {
      font-family: var(--font-display); font-size: clamp(10rem, 28vw, 20rem);
      font-weight: 800; line-height: 0.85; letter-spacing: -0.03em;
      color: var(--text); user-select: none;
    }
    .err__line { width: 50px; height: 1px; background: var(--border); margin: 2rem auto; }
    .err__msg { font-size: 1rem; color: var(--text-dim); margin-bottom: 0.4rem; }
    .err__sub { font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 3rem; }
    .err__actions { display: flex; gap: 0.8rem; }
  </style>
</head>
<body>

<header class="hdr hdr--solid">
  <a href="/index.html" class="hdr__logo">
    <img src="/assets/images/logo/white.png" alt="MAYDAY" />
  </a>
</header>

<div class="err">
  <div class="err__code fi">404</div>
  <div class="err__line fi fi-d1"></div>
  <p class="err__msg fi fi-d1">Página não encontrada.</p>
  <p class="err__sub fi fi-d2">Parece que se perdeu no set</p>
  <div class="err__actions fi fi-d3">
    <a href="/index.html" class="btn btn--fill">Voltar ao Início</a>
    <a href="/contacto.html" class="btn btn--outline">Contacto</a>
  </div>
</div>

<script src="/assets/scripts/main.js"></script>
</body>
</html>
